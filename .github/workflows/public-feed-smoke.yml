name: Public source live smoke checks
on:
  push:
    branches: [master]
    paths: ['tests/public_sources_live.test.mjs', '.github/workflows/public-feed-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/public_sources_live.test.mjs
