name: Project Lab Unified live HTTP smoke test
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'unified-app/tests/live-http.test.mjs'
      - '.github/workflows/unified-live-smoke.yml'
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test unified-app/tests/live-http.test.mjs
