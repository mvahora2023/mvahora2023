name: Project Lab Unified real-browser tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'unified-app/tests/live-browser.spec.mjs'
      - '.github/workflows/unified-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test unified-app/tests/live-browser.spec.mjs --reporter=line --workers=1
